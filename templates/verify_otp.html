<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification WhatsApp - TATAW</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-xl border border-gray-200">
    <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">📲</div>
    <h2 class="text-base font-black uppercase text-gray-900 mb-1">Entrez le code reçu</h2>
    <p class="text-xs text-gray-500 mb-4">Saisissez le code à 6 chiffres envoyé sur votre compte WhatsApp.</p>

    <form action="/verify-otp" method="POST" class="space-y-3">
      <input type="text" name="otp_code" maxlength="6" placeholder="000000" required class="w-full text-center text-lg font-mono font-bold tracking-widest p-3 border border-gray-300 rounded-xl focus:outline-none focus:border-green-600">
      <button type="submit" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider">
        Valider et se connecter
      </button>
    </form>
  </div>
</body>
</html>
