<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATAW | Administration Catalogue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen">

    <header class="bg-black border-b border-gray-800 py-6 px-8 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tight text-red-500 uppercase">Panel Admin — TATAW</h1>
            <p class="text-xs text-gray-400">Gérez vos visuels, catégories et prix en temps réel.</p>
        </div>
        <a href="/" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-bold py-2 px-4 rounded-xl transition-all">
            <i class="fa-solid fa-globe mr-1"></i> Voir le site
        </a>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">

        <!-- Formulaire d'Ajout Produit -->
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl mb-10 shadow-xl">
            <h2 class="text-sm font-bold uppercase text-gray-200 mb-4"><i class="fa-solid fa-plus-circle mr-2 text-red-500"></i> Ajouter un nouvel article</h2>
            <form action="/admin/add-product" method="POST" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <input type="text" name="name" placeholder="Nom de l'article" required class="bg-gray-900 border border-gray-700 text-xs p-3 rounded-xl text-white focus:outline-none focus:border-red-500">
                
                <select name="category" required class="bg-gray-900 border border-gray-700 text-xs p-3 rounded-xl text-white">
                    <option value="homme">Homme</option>
                    <option value="femme">Femme</option>
                    <option value="cosmetiques">Cosmétiques</option>
                </select>

                <select name="subcategory" required class="bg-gray-900 border border-gray-700 text-xs p-3 rounded-xl text-white">
                    <option value="tshirts">T-shirts</option>
                    <option value="pulls">Pulls</option>
                    <option value="croptops">Croptops</option>
                    <option value="ensembles">Ensembles</option>
                    <option value="babouches">Babouches</option>
                    <option value="chaussures">Chaussures</option>
                    <option value="chaussettes">Chaussettes</option>
                    <option value="sacs">Sacs</option>
                </select>

                <input type="text" name="image_url" placeholder="Lien URL de l'image" required class="bg-gray-900 border border-gray-700 text-xs p-3 rounded-xl text-white focus:outline-none focus:border-red-500 col-span-1 sm:col-span-2">
                
                <input type="text" name="price" placeholder="Prix FCFA (laisser vide si sur demande)" class="bg-gray-900 border border-gray-700 text-xs p-3 rounded-xl text-white focus:outline-none focus:border-red-500">

                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs uppercase p-3 rounded-xl transition-all col-span-1 sm:col-span-2 lg:col-span-3">
                    Enregistrer l'article
                </button>
            </form>
        </div>

        <!-- Catalogue Actuel Admin -->
        <h2 class="text-sm font-bold uppercase text-gray-200 mb-6"><i class="fa-solid fa-list mr-2 text-red-500"></i> Produits enregistrés dans la base de données</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for p in products %}
            <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl flex flex-col justify-between">
                <div>
                    <img src="{{ p.image_url }}" class="h-40 w-full object-cover rounded-xl mb-3">
                    <span class="text-[10px] font-bold uppercase text-red-400">{{ p.category }} • {{ p.subcategory }}</span>
                    <h3 class="font-bold text-white text-sm mt-1 mb-3">{{ p.name }}</h3>
                </div>

                <form action="/admin/update-product/{{ p.id }}" method="POST" class="space-y-2 pt-2 border-t border-gray-700">
                    <label class="text-[10px] text-gray-400 uppercase">Lien Image URL:</label>
                    <input type="text" name="image_url" value="{{ p.image_url }}" class="w-full bg-gray-900 text-xs p-2 rounded border border-gray-700 text-gray-300">
                    
                    <label class="text-[10px] text-gray-400 uppercase">Prix (FCFA):</label>
                    <input type="text" name="price" value="{{ p.price }}" placeholder="Prix sur demande" class="w-full bg-gray-900 text-xs p-2 rounded border border-gray-700 text-gray-300">

                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 rounded-lg">Mettre à jour</button>
                </form>

                <form action="/admin/delete-product/{{ p.id }}" method="POST" class="w-1/2">
                    <button type="submit" onclick="return confirm('Supprimer cet article ?')" class="w-full bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 rounded-lg">Supprimer</button>
                </form>
                    </div>
            </div>
            {% endfor %}
        </div>

    </main>
</body>
</html>
