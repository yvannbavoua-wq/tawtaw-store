<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Admin - TATAW</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 min-h-screen">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-black mb-6 border-b border-gray-800 pb-3">GESTION DU CATALOGUE TATAW</h1>

    <!-- FORMULAIRE AJOUT PRODUIT -->
    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-8">
      <h2 class="text-sm font-bold uppercase mb-4 text-red-500">Ajouter un nouvel article</h2>
      <form action="/admin/add-product" method="POST" class="space-y-3">
        <input type="text" name="name" placeholder="Nom de l'article" required class="w-full bg-gray-900 text-xs p-2.5 rounded border border-gray-700">
        
        <div class="grid grid-cols-2 gap-2">
          <input type="text" name="category" placeholder="Catégorie (ex: HOMME)" required class="bg-gray-900 text-xs p-2.5 rounded border border-gray-700">
          <input type="text" name="subcategory" placeholder="Sous-catégorie (ex: T-SHIRTS)" required class="bg-gray-900 text-xs p-2.5 rounded border border-gray-700">
        </div>

        <input type="text" name="image_url" placeholder="URL Directe de l'image (ex: https://i.ibb.co/...)" required class="w-full bg-gray-900 text-xs p-2.5 rounded border border-gray-700">
        <input type="text" name="price" placeholder="Prix en FCFA" class="w-full bg-gray-900 text-xs p-2.5 rounded border border-gray-700">
        
        <!-- Nouveaux Champs -->
        <input type="text" name="options" placeholder="Modèles/Tailles/Couleurs (ex: Noir, Blanc, Rose OU M, L, XL)" class="w-full bg-gray-900 text-xs p-2.5 rounded border border-gray-700">
        <textarea name="description" placeholder="Description de l'article..." class="w-full bg-gray-900 text-xs p-2.5 rounded border border-gray-700 h-20"></textarea>

        <button type="submit" class="w-full bg-red-600 font-bold text-xs py-3 rounded uppercase">Enregistrer l'article</button>
      </form>
    </div>

    <!-- LISTE DES PRODUITS -->
    <h2 class="text-sm font-bold uppercase mb-4 text-gray-400">Articles en Base de Données</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      {% for p in products %}
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex gap-4">
        <img src="{{ p.image_url }}" class="w-20 h-20 object-cover rounded-lg bg-gray-900">
        <div class="flex-grow text-xs">
          <h3 class="font-bold text-sm">{{ p.name }}</h3>
          <p class="text-gray-400 mb-2">{{ p.price }} FCFA</p>
          <form action="/admin/update-product/{{ p.id }}" method="POST" class="space-y-2">
            <input type="text" name="image_url" value="{{ p.image_url }}" class="w-full bg-gray-900 p-1.5 rounded border border-gray-700">
            <input type="text" name="price" value="{{ p.price }}" class="w-full bg-gray-900 p-1.5 rounded border border-gray-700">
            <input type="text" name="options" value="{{ p.options if p.options else '' }}" placeholder="Options" class="w-full bg-gray-900 p-1.5 rounded border border-gray-700">
            <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded text-[10px] uppercase font-bold">Mettre à jour</button>
          </form>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
